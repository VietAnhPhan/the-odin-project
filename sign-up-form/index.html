<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign-up form</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="container">
        <div class="logo-background">
            <div class="logo">
                <img src="resources/images/odin-lined.png" alt="" srcset="">
                <span class="logo-name">ODIN</span>
            </div>
            <div class="credit"><span>Photo by <a
                        href="https://unsplash.com/@haliewestphoto?utm_content=creditCopyText&utm_medium=referral&utm_source=unsplash">Halie
                        West</a> on <a
                        href="https://unsplash.com/photos/green-leaf-plant-in-close-up-photography-25xggax4bSA?utm_content=creditCopyText&utm_medium=referral&utm_source=unsplash">Unsplash</a></span>
            </div>
        </div>
        <div class="form-create-account">
            <div class="descriptive-form">
                <p>This is not a real online service! You know you need something like this in your life to help you
                    realize your deepest dreams. Sign up <em>now</em> to get started.</p>
                <br>
                <p>You <em>know</em> you want to.</p>
            </div>
            <form action="#">
                <div class="input-form-outter">
                    <h2>Let's do this!</h2>
                    <div class="input-form-inner">
                        <div class="input-row">
                            <div class="input-form">
                                <label for="first-name">first name</label>
                                <input type="text" name="first_name" id="first-name">
                            </div>
                            <div class="input-form">
                                <label for="last-name">last name</label>
                                <input type="text" name="last_name" id="last-name">
                            </div>
                        </div>
                        <div class="input-row">
                            <div class="input-form">
                                <label for="email">email</label>
                                <input type="email" name="email" id="email">
                            </div>
                            <div class="input-form">
                                <label for="phone-number">phone number</label>
                                <input type="tel" name="phone_number" id="phone-number">
                            </div>
                        </div>
                        <div class="input-row">
                            <div class="input-form">
                                <label for="password">password</label>
                                <input type="password" name="password" id="password" required="required">
                            </div>
                            <div class="input-form">
                                <label for="confirm-password">confirm password</label>
                                <input type="password" name="confirm_password" id="confirm-password"
                                    required="required">
                            </div>
                        </div>
                    </div>
                </div class="input-form-outter">
                <button>Create Account</button>
                <span class="login">Already have an account? <a href="http://">Login</a></span>
            </form>
        </div>
    </div>
</body>

</html>
